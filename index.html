<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Chocolate Day ❤️🍫</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    height: 100vh;
    background: linear-gradient(135deg, #3e1f0e, #8b4513);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .container {
    background: rgba(255, 255, 255, 0.12);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    animation: fadeIn 2s ease;
    max-width: 420px;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    animation: slideDown 1.5s ease;
  }

  p {
    font-size: 1.1rem;
    margin-bottom: 25px;
    color: #ffe6cc;
  }

  button {
    background: #5a2d0c;
    border: none;
    padding: 14px 28px;
    font-size: 1rem;
    border-radius: 30px;
    cursor: pointer;
    color: #fff;
    transition: all 0.3s ease;
  }

  button:hover {
    background: #3b1c0b;
    transform: scale(1.08);
  }

  .message {
    margin-top: 25px;
    font-size: 1.2rem;
    font-style: italic;
    min-height: 60px;
    color: #ffd9b3;
    animation: fadeIn 1s ease;
  }

  .emoji {
    font-size: 3rem;
    margin-bottom: 15px;
    animation: bounce 2s infinite;
  }

  /* Floating hearts & chocolates */
  .float {
    position: absolute;
    font-size: 1.5rem;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.5);
      opacity: 0;
    }
    50% {
      opacity: 1;
    }
    100% {
      transform: translateY(-10vh) scale(1.2);
      opacity: 0;
    }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideDown {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>

<body>

<div class="container">
  <div class="emoji">🍫❤️</div>
  <h1>Happy Chocolate Day</h1>
  <p>Because love becomes sweeter when wrapped in chocolate</p>
  <button onclick="showLove()">Send Chocolate Love</button>
  <div class="message" id="message"></div>
</div>

<script>
  const messages = [
    "Just like chocolate, you melt my heart every day 🍫❤️",
    "Life tastes sweeter with you by my side 💕",
    "You are my favorite chocolate in this box of life 🍬",
    "Every smile of yours is sweeter than chocolate 😍",
    "Chocolate is temporary, but my love for you is forever ❤️"
  ];

  function showLove() {
    const random = Math.floor(Math.random() * messages.length);
    document.getElementById("message").innerText = messages[random];
  }

  // Floating emojis generator
  setInterval(() => {
    const float = document.createElement("div");
    float.className = "float";
    float.innerText = Math.random() > 0.5 ? "❤️" : "🍫";
    float.style.left = Math.random() * 100 + "vw";
    float.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(float);

    setTimeout(() => {
      float.remove();
    }, 7000);
  }, 500);
</script>

</body>
</html>
